<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFT Order Book Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #1e2329;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --bid-color: #0ecb81;
            --ask-color: #f6465d;
            --border-color: #2b313a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 { margin: 0; font-size: 22px; color: var(--text-main); }
        .badge { background: #2b313a; padding: 4px 10px; border-radius: 4px; font-size: 12px; color: var(--bid-color); }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th { text-align: left; color: var(--text-muted); padding: 8px 4px; font-weight: 500; }
        td { padding: 6px 4px; font-family: 'Courier New', Courier, monospace; }

        .price-bid { color: var(--bid-color); font-weight: bold; }
        .price-ask { color: var(--ask-color); font-weight: bold; }

        .stats-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 6px;
            flex: 1;
        }

        .stat-box .val { font-size: 20px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>HFT Limit Order Book Engine</h1>
        <span class="badge">● Engine Live (C++17)</span>
    </div>

    <div class="stats-container">
        <div class="stat-box">
            <div class="card-title">Best Bid</div>
            <div class="val price-bid" id="best-bid">0.00</div>
        </div>
        <div class="stat-box">
            <div class="card-title">Best Ask</div>
            <div class="val price-ask" id="best-ask">0.00</div>
        </div>
        <div class="stat-box">
            <div class="card-title">Spread</div>
            <div class="val" id="spread" style="color: var(--text-main);">0.00</div>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- Bids Table -->
        <div class="card">
            <div class="card-title" style="color: var(--bid-color);">Bids (Buy Orders)</div>
            <table>
                <thead>
                    <tr><th>Price ($)</th><th>Quantity</th><th>Total</th></tr>
                </thead>
                <tbody id="bids-body"></tbody>
            </table>
        </div>

        <!-- Asks Table -->
        <div class="card">
            <div class="card-title" style="color: var(--ask-color);">Asks (Sell Orders)</div>
            <table>
                <thead>
                    <tr><th>Price ($)</th><th>Quantity</th><th>Total</th></tr>
                </thead>
                <tbody id="asks-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const DATA_URL = new URL('./orderbook_data.json', window.location.href).toString();

        function parseNumber(value, fallback = 0) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : fallback;
        }

        function renderEmptyState(tableId, label) {
            const tbody = document.getElementById(tableId);
            tbody.innerHTML = `<tr><td colspan="3" style="color: var(--text-muted); text-align: center; padding: 12px;">${label}</td></tr>`;
        }

        async function updateDashboard() {
            try {
                const response = await fetch(DATA_URL + '?t=' + Date.now(), {
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error('JSON not available yet');
                }

                const text = await response.text();
                if (!text.trim()) {
                    throw new Error('Empty JSON payload');
                }

                const data = JSON.parse(text);
                const bestBid = parseNumber(data.best_bid?.price ?? data.best_bid, 0);
                const bestAsk = parseNumber(data.best_ask?.price ?? data.best_ask, 0);
                const bids = Array.isArray(data.bids) ? data.bids : [];
                const asks = Array.isArray(data.asks) ? data.asks : [];

                document.getElementById('best-bid').innerText = bestBid.toFixed(2);
                document.getElementById('best-ask').innerText = bestAsk.toFixed(2);
                document.getElementById('spread').innerText = (bestAsk - bestBid).toFixed(2);

                const bidsBody = document.getElementById('bids-body');
                if (bids.length === 0) {
                    renderEmptyState('bids-body', 'Waiting for bids...');
                } else {
                    bidsBody.innerHTML = bids.map(b => {
                        const price = parseNumber(b.price, 0);
                        const quantity = parseNumber(b.quantity, 0);
                        return `<tr><td class="price-bid">${price.toFixed(2)}</td><td>${quantity}</td><td>${(price * quantity).toFixed(2)}</td></tr>`;
                    }).join('');
                }

                const asksBody = document.getElementById('asks-body');
                if (asks.length === 0) {
                    renderEmptyState('asks-body', 'Waiting for asks...');
                } else {
                    asksBody.innerHTML = asks.map(a => {
                        const price = parseNumber(a.price, 0);
                        const quantity = parseNumber(a.quantity, 0);
                        return `<tr><td class="price-ask">${price.toFixed(2)}</td><td>${quantity}</td><td>${(price * quantity).toFixed(2)}</td></tr>`;
                    }).join('');
                }
            } catch (e) {
                console.log('Waiting for orderbook_data.json...');
            }
        }

        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
