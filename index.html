<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFT Order Book Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #1e2329;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --bid-color: #0ecb81;
            --ask-color: #f6465d;
            --border-color: #2b313a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 { margin: 0; font-size: 22px; color: var(--text-main); }
        .badge { background: #2b313a; padding: 4px 10px; border-radius: 4px; font-size: 12px; color: var(--bid-color); }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th { text-align: left; color: var(--text-muted); padding: 8px 4px; font-weight: 500; }
        td { padding: 6px 4px; font-family: 'Courier New', Courier, monospace; }

        .price-bid { color: var(--bid-color); font-weight: bold; }
        .price-ask { color: var(--ask-color); font-weight: bold; }

        .stats-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 6px;
            flex: 1;
        }

        .stat-box .val { font-size: 20px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>HFT Limit Order Book Engine</h1>
        <span class="badge">● Engine Live (C++17)</span>
    </div>

    <div class="stats-container">
        <div class="stat-box">
            <div class="card-title">Best Bid</div>
            <div class="val price-bid" id="best-bid">0.00</div>
        </div>
        <div class="stat-box">
            <div class="card-title">Best Ask</div>
            <div class="val price-ask" id="best-ask">0.00</div>
        </div>
        <div class="stat-box">
            <div class="card-title">Spread</div>
            <div class="val" id="spread" style="color: var(--text-main);">0.00</div>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- Bids Table -->
        <div class="card">
            <div class="card-title" style="color: var(--bid-color);">Bids (Buy Orders)</div>
            <table>
                <thead>
                    <tr><th>Price ($)</th><th>Quantity</th><th>Total</th></tr>
                </thead>
                <tbody id="bids-body"></tbody>
            </table>
        </div>

        <!-- Asks Table -->
        <div class="card">
            <div class="card-title" style="color: var(--ask-color);">Asks (Sell Orders)</div>
            <table>
                <thead>
                    <tr><th>Price ($)</th><th>Quantity</th><th>Total</th></tr>
                </thead>
                <tbody id="asks-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function updateDashboard() {
            try {
                const response = await fetch('orderbook_data.json?t=' + new Date().getTime());
                const data = await response.json();

                // Stats Update
                document.getElementById('best-bid').innerText = data.best_bid.toFixed(2);
                document.getElementById('best-ask').innerText = data.best_ask.toFixed(2);
                document.getElementById('spread').innerText = (data.best_ask - data.best_bid).toFixed(2);

                // Render Bids
                const bidsBody = document.getElementById('bids-body');
                bidsBody.innerHTML = data.bids.map(b => 
                    `<tr><td class="price-bid">${b.price.toFixed(2)}</td><td>${b.quantity}</td><td>${(b.price * b.quantity).toFixed(2)}</td></tr>`
                ).join('');

                // Render Asks
                const asksBody = document.getElementById('asks-body');
                asksBody.innerHTML = data.asks.map(a => 
                    `<tr><td class="price-ask">${a.price.toFixed(2)}</td><td>${a.quantity}</td><td>${(a.price * a.quantity).toFixed(2)}</td></tr>`
                ).join('');
            } catch (e) {
                console.log("Waiting for data...");
            }
        }

        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
